<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | TGBSS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/11.1.7/framer-motion.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; overflow-x: hidden; }
        .kinetic-text { font-size: clamp(3rem, 8vw, 6rem); line-height: 0.9; font-weight: 900; letter-spacing: -0.05em; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 32px; }
        .red-accent { color: #E30613; }
        .blue-accent { color: #004B91; }
        input, textarea { background: #f9fafb; border: 2px solid #f3f4f6; padding: 1.5rem; border-radius: 20px; outline: none; transition: all 0.3s ease; width: 100%; font-weight: 500; }
        input:focus, textarea:focus { border-color: #E30613; background: white; }
    </style>
</head>
<body class="bg-gray-50">

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 px-8 py-4 flex justify-between items-center bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="flex items-center gap-4">
            <img src="assets/partners/logo_main.png?v=2026" style="height: 50px; width: auto;" alt="TGBSS Logo">
            <div class="text-xl font-bold tracking-tighter">TGBSS.</div>
        </div>
        <div class="hidden md:flex gap-12 text-sm font-medium uppercase tracking-widest text-gray-500">
            <a href="index.html" class="hover:text-red-600 transition-colors">Home</a>
            <a href="the-show.html" class="hover:text-red-600 transition-colors">The Show</a>
            <a href="performance.html" class="hover:text-red-600 transition-colors">Performance</a>
            <a href="nutrition.html" class="hover:text-red-600 transition-colors">Nutrition</a>
            <a href="commercial.html" class="hover:text-red-600 transition-colors">Commercial</a>
            <a href="case-studies.html" class="hover:text-red-600 transition-colors">Case Studies</a>
            <a href="contact.html" class="hover:text-red-600 transition-colors">Contact</a>
        </div>
    </nav>

    <!-- Header -->
    <section class="pt-40 pb-20 px-8 md:px-24 bg-white">
        <div class="max-w-6xl">
            <span class="text-blue-600 font-black uppercase tracking-[0.3em] text-sm">Get in Touch</span>
            <h1 class="kinetic-text mt-6 mb-8">LET'S START <br><span class="red-accent">THE ACTIVATION.</span></h1>
        </div>
    </section>

    <!-- Contact Grid -->
    <section class="py-24 px-8 md:px-24">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-20">
            
            <!-- Form -->
            <div class="glass-card p-12 bg-white">
                <form class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" placeholder="Full Name">
                        <input type="email" placeholder="Work Email">
                    </div>
                    <input type="text" placeholder="Organization">
                    <select class="w-full bg-[#f9fafb] border-2 border-[#f3f4f6] p-6 rounded-[20px] outline-none font-medium appearance-none">
                        <option>Host a Show</option>
                        <option>Matchday Activation</option>
                        <option>Workplace Event</option>
                        <option>Equipment Purchase</option>
                        <option>Other Enquiry</option>
                    </select>
                    <textarea placeholder="Tell us about your brief" rows="5"></textarea>
                    <button class="bg-[#E30613] text-white px-12 py-6 rounded-full font-black text-xl hover:bg-black transition-all shadow-xl shadow-red-500/20 w-full">Send Message</button>
                </form>
            </div>

            <!-- Info -->
            <div class="flex flex-col justify-center">
                <div class="space-y-12">
                    <div>
                        <h3 class="text-xs uppercase tracking-widest font-black text-gray-400 mb-4">Phone</h3>
                        <p class="text-3xl font-black">+44(0) 1494 782 743</p>
                    </div>
                    <div>
                        <h3 class="text-xs uppercase tracking-widest font-black text-gray-400 mb-4">Email</h3>
                        <p class="text-3xl font-black">info@tgbss.co.uk</p>
                    </div>
                    <div>
                        <h3 class="text-xs uppercase tracking-widest font-black text-gray-400 mb-4">Social</h3>
                        <p class="text-3xl font-black">@TGBSSEvents</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="px-8 md:px-24 py-12 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center text-sm text-gray-400 font-medium bg-white">
        <div>© 2026 THE GREAT BRITISH SPORTS SHOW. ALL RIGHTS RESERVED.</div>
        <div class="flex gap-8 mt-4 md:mt-0">
            <a href="#" class="hover:text-black">PRIVACY</a>
            <a href="#" class="hover:text-black">TERMS</a>
            <a href="contact.html" class="hover:text-black">CONTACT</a>
        </div>
    </footer>

</body>
</html>
